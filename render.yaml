services:
  # Backend API
  - type: web
    name: panchayatguard-api
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: panchayat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # Update this in dashboard after frontend is deployed if needed

  # Frontend Web App
  - type: web
    name: panchayatguard-web
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: panchayatguard-api
          property: url
          # Render appends /api in your frontend code if needed, but since api.ts uses VITE_API_URL, we need to append /api
          # Unfortunately fromService just gives the host. You can update VITE_API_URL manually in dashboard.

databases:
  # PostgreSQL Database
  - name: panchayat-db
    plan: free
    region: oregon
    databaseName: panchayat_db
    user: panchayat_user
