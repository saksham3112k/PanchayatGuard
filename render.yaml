services:
  # Unified Backend & Frontend API
  - type: web
    name: panchayatguard-unified
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: panchayat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  # PostgreSQL Database
  - name: panchayat-db
    plan: free
    region: oregon
    databaseName: panchayat_db
    user: panchayat_user
